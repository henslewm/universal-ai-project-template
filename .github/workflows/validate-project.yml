name: Validate AI project repository

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The standalone-skill payload is generated, not tracked. Build it first so the tests that
      # exercise it run, then fail if regenerating changed any tracked native skill mirror.
      - name: Build bootstrap payload and check native mirrors
        run: |
          python scripts/sync_skills.py
          git diff --exit-code -- .claude/skills .agents/skills skills
      - name: Validate repository
        run: python scripts/validate_project.py
      - name: Run tests
        run: |
          python -m pip install -r requirements-work-packets.txt
          python -m unittest discover -s tests -p "test_*.py"
