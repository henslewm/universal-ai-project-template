name: Validate AI project repository

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate repository
        run: python scripts/validate_project.py
      - name: Run tests
        run: |
          python -m pip install -r requirements-work-packets.txt
          python -m unittest discover -s tests -p "test_*.py"
      # Only the template repository carries the bootstrap payload. A generated project inherits
      # this workflow but has no payload to mirror, so the check is skipped there (#49).
      - name: Verify bootstrap distribution payloads
        run: |
          if [ -d skills/complex-project-bootstrapper/assets/project-template ]; then
            python scripts/sync_skills.py --check
          else
            echo "No bootstrap payload in this repository; payload check skipped."
          fi
