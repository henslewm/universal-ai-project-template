; Example only: never copy this into a project. A real project regenerates its root
; platformio.ini under docs/PLATFORMIO.md from observed hardware (`esptool flash-id`)
; and its pinned core. This variant is Arduino-ESP32 2.0.x on stock espressif32 6.x;
; docs/PLATFORMIO.md shows the Arduino-ESP32 3.x (pioarduino) variant.
;
; esptool flash-id (illustrative; record the real output here):
;   Chip: ESP32-S3 (QFN56) ; Embedded PSRAM 8MB (AP_3v3) ; Detected flash size: 16MB
; Board: ESP32-S3-DevKitC-1 N16R8, console on native USB (303A:1001)
; Equivalent arduino-cli build of [env:dev] (rule 10), with core esp32:esp32@2.0.17, the core
; espressif32@6.9.0 ships:
;   arduino-cli compile -b esp32:esp32:esp32s3:CDCOnBoot=cdc,PSRAM=opi,FlashMode=qio,FlashSize=16M,DebugLevel=error
;     --build-property build.partitions=default_16MB --build-property upload.maximum_size=6553600 <sketch>
; The gnu++17 override has no menu option; if the code needs it, record the compiler.cpp.flags
; override used. The two toolchains still produce different ELFs; evidence names which one built it.

[platformio]
default_envs = dev

; ---- shared settings ----
[env]
platform = espressif32@6.9.0                   ; exact pin (Arduino-ESP32 2.0.x) = reproducible builds
board = esp32-s3-devkitc-1
framework = arduino

board_build.arduino.memory_type = qio_opi      ; octal PSRAM observed by flash-id
board_build.flash_mode = qio
board_build.f_flash = 80000000L                ; 80 MHz flash (default is 40)
board_upload.flash_size = 16MB
board_upload.maximum_size = 6553600            ; app0 of default_16MB.csv, not the physical flash size
board_build.partitions = default_16MB.csv
board_build.filesystem = littlefs              ; data/ folder -> pio run -t uploadfs

; Arduino-ESP32 2.0.x defaults to gnu++11; keep this override only if the code needs C++17.
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1

; Match the board's USB VID:PID, not a COM number, so the port survives renumbering
; and other devices on the same hub are ignored.
upload_port  = hwgrep://303A:1001
monitor_port = hwgrep://303A:1001
upload_speed = 921600                          ; only matters on UART bridges; native USB ignores it
monitor_speed = 115200                         ; must equal the sketch's Serial.begin()
monitor_filters = esp32_exception_decoder, time

; ---- everyday: quiet boot (errors only) ----
[env:dev]
build_flags = ${env.build_flags} -DCORE_DEBUG_LEVEL=1

; ---- verbose logs ----
[env:debug]
build_flags = ${env.build_flags} -DCORE_DEBUG_LEVEL=4

; ---- release: logs off, smaller/faster ----
[env:release]
build_flags = ${env.build_flags} -DCORE_DEBUG_LEVEL=0 -Os
